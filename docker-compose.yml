version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    restart: always
    networks:
      - app-network

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: db_penduduk
      MYSQL_USER: user_penduduk
      MYSQL_PASSWORD: userpassword
    # ports:
    #   - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
  
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin_panel
    restart: always
    ports:
      - "8001:80" # Akses phpMyAdmin di browser via http://localhost:8001
    environment:
      PMA_HOST: db # Menghubungkan phpMyAdmin ke service "db" di atas
      PMA_PORT: 3306
      ULONG_MAX: 4294967295
    networks:
      - app-network
    depends_on:
      - db

networks:
  app-network:
    driver: bridge

volumes:
  db_data: